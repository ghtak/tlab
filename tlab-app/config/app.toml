[server.http]
bind = "127.0.0.1:8080"

[server.https]
bind = "127.0.0.1:8081"

[server.https.tls]
certificate_chain = "./tls_cert.pem"
private_key = "./tls_key.pem"
generate_if_missing = true

[passwd_hasher]
memory_kib = 19456
iterations = 2
parallelism = 1

[auth]
max_concurrent_password_hashes = 2

[auth.jwt]
private_key = "./jwt_private.pem"
public_key = "./jwt_public.pem"
generate_if_missing = false
issuer = "tlab"
audience = "tlab-api"

[auth.web]
# Exact public origin; no trailing slash. Web unsafe requests require this Origin.
origin = "https://localhost:8081"
# Development HTTP only: also set origin to http://localhost:8080.
# Uses separate tlab_dev_* cookies; production defaults remain Secure/HttpOnly.
allow_insecure_http = false

[database]
# Set TLAB_APP_DATABASE__URL in .env or the environment.
url = ""
max_connections = 5

[tracing.console]
filter = "info"
ansi = true

[tracing.file]
# Relative to the process's working directory.
directory = "./logs"
filename_prefix = "tlab-app.log"
