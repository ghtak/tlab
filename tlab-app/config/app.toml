[server.http]
bind = "127.0.0.1:8080"

[server.https]
bind = "127.0.0.1:8081"

[server.https.tls]
certificate_chain = "./tls_cert.pem"
private_key = "./tls_key.pem"
generate_if_missing = true

[passwd_hasher]
memory_kib = 19456
iterations = 2
parallelism = 1

[tracing.console]
filter = "info"
ansi = true

[tracing.file]
# Relative to the process's working directory.
directory = "./logs"
filename_prefix = "tlab-app.log"
