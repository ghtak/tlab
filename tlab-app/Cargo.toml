[package]
name = "tlab-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
dotenvy = "0.15"
email_address = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "derive", "time"] }
tlab = { path = "../tlab" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
