[package]
name = "tlab"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
getrandom = "0.2"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
config = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }

[dev-dependencies]
base64ct = { version = "1", features = ["alloc"] }
sha2 = "0.10"
ring = "0.17"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
serde_json = "1"
