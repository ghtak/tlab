[package]
name = "tlab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
config = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
