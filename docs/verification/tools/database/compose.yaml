name: tlab-db

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tlab
      POSTGRES_USER: tlab
      POSTGRES_PASSWORD: tlab_dev
    ports:
      - "127.0.0.1:${TLAB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres.sql:/verification/check.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tlab", "-d", "tlab"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valkey:
    image: valkey/valkey:8.1.11
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${TLAB_VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
      - ./valkey.sh:/verification/check.sh:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  oracle:
    image: gvenzl/oracle-free:23.26.3
    environment:
      ORACLE_PASSWORD: tlab_admin_dev
      APP_USER: tlab
      APP_USER_PASSWORD: tlab_dev
    ports:
      - "127.0.0.1:${TLAB_ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle.sql:/verification/check.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  postgres-data:
  valkey-data:
  oracle-data:
